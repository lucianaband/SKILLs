<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" role="img" aria-label="phocus">
  <title>phocus</title>
  <!-- Símbolo: círculo flutuante + haste (o "p" característico) -->
  <circle cx="28" cy="30" r="22" fill="#F9F9F9"/>
  <rect x="16" y="42" width="14" height="52" rx="7" fill="#F9F9F9"/>
  <!-- Wordmark "hocus" em fonte arredondada -->
  <text x="56" y="83"
        font-family="'Nunito', 'Varela Round', 'Arial Rounded MT Bold', Arial, sans-serif"
        font-weight="900"
        font-size="62"
        fill="#F9F9F9"
        letter-spacing="-1">hocus</text>
</svg>
